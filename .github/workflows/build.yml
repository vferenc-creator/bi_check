name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet -unsafeptr=false ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests (Windows time zone database & file system)
        run: go test ./...
      - name: Build
        shell: pwsh
        run: |
          $v = "0.0.0-ci.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          ./build.ps1 -Version $v
      - name: GUI smoke test (tray + WebView2 window + JS bridge)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "bimon"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process dist/BIMonitor.exe -ArgumentList "--data-dir", $d, "--selftest", $out -PassThru -Wait
          $r = if (Test-Path $out) { Get-Content $out } else { "no output" }
          Write-Host "exit=$($p.ExitCode) result=$r"
          if (Test-Path "$d/local/logs/monitor.log") { Get-Content "$d/local/logs/monitor.log" }
          if ($r -ne "ok") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: BIMonitor-exe
          path: dist/BIMonitor.exe
