name: build

# Every push is tested on Linux and Windows (incl. a GUI smoke test of the
# real exe). Pushes to the default branch (or the development branch) that
# pass all checks are published automatically as a GitHub Release marked
# "Latest", so the newest exe is always at
#   https://github.com/<owner>/<repo>/releases/latest
# Version: <VERSION file>.<run number>, e.g. 1.0.17.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet -unsafeptr=false ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $v = "$base.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
      - name: Unit tests (Windows time zone database & file system)
        run: go test ./...
      - name: Shared-mode concurrency tests, repeated (catch rare races on NTFS)
        run: go test -count=10 ./internal/teamstore
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: GUI smoke test (tray + WebView2 window + JS bridge)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "bimon"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process dist/BIMonitor.exe -ArgumentList "--data-dir", $d, "--selftest", $out -PassThru -Wait
          $r = if (Test-Path $out) { Get-Content $out } else { "no output" }
          Write-Host "exit=$($p.ExitCode) result=$r"
          if (Test-Path "$d/local/logs/monitor.log") { Get-Content "$d/local/logs/monitor.log" }
          if ($r -ne "ok") { exit 1 }
      - name: GUI smoke test – file picker ("Tallózás")
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "bimon2"
          $out = Join-Path $env:RUNNER_TEMP "selftest2.txt"
          $p = Start-Process dist/BIMonitor.exe -ArgumentList "--data-dir", $d, "--selftest", $out, "--selftest-dialog" -PassThru -Wait
          $r = if (Test-Path $out) { Get-Content $out } else { "no output" }
          Write-Host "exit=$($p.ExitCode) result=$r"
          if (Test-Path "$d/local/logs/monitor.log") { Get-Content "$d/local/logs/monitor.log" }
          if ($r -ne "ok") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: BIMonitor-exe
          path: dist/BIMonitor.exe

  release:
    needs: [test-linux, windows]
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == 'claude/nifty-tesla-wqcp1f')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: BIMonitor-exe
          path: dist
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --no-merges --pretty='- %s' "$prev..HEAD" > changes.txt
          else
            git log --no-merges --pretty='- %s' -20 > changes.txt
          fi
          [ -s changes.txt ] || echo "- Újrafordítás" > changes.txt
          python3 - <<'PY'
          import os
          notes = open(".github/release-notes.md", encoding="utf-8").read()
          sha = os.environ["GITHUB_SHA"]
          notes = (notes.replace("{{CHANGES}}", open("changes.txt", encoding="utf-8").read().strip())
                        .replace("{{SHA_SHORT}}", sha[:7])
                        .replace("{{SHA}}", sha))
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY
          cat notes.md
      - name: Publish release
        run: |
          gh release create "v$VERSION" \
            "dist/BIMonitor.exe" \
            "docs/BIMonitor_minta_elemek.json" \
            --title "Energofish BI Output Monitor $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
